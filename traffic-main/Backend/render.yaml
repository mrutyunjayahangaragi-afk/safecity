services:
  - type: web
    name: saferoute-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: PILOT_CITY
        value: bengaluru
      - key: PILOT_STATE
        value: karnataka
